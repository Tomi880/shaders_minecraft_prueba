# IDs propios para distinguir familias de emisores en fases posteriores.
# Iris acepta IDs de bloque signed 16-bit; estos valores están dentro del rango documentado.

# 1001: emisión cálida de antorchas, faroles, fuego y fogatas encendidas.
block.1001 = minecraft:torch minecraft:wall_torch minecraft:lantern minecraft:campfire:lit=true minecraft:jack_o_lantern minecraft:shroomlight minecraft:fire

# 1002: emisión fría azulada de las fuentes de fuego de almas.
block.1002 = minecraft:soul_torch minecraft:soul_wall_torch minecraft:soul_lantern minecraft:soul_campfire:lit=true minecraft:soul_fire

# 1003: emisión naranja de lava y magma.
block.1003 = minecraft:lava minecraft:lava_cauldron minecraft:magma_block

# 1004–1006: materiales distintos para ajustar matiz e intensidad por fuente.
block.1004 = minecraft:glowstone
block.1005 = minecraft:sea_lantern
block.1006 = minecraft:end_rod

# 1007: emisión roja; antorchas y lámpara solo se clasifican cuando están encendidas.
block.1007 = minecraft:redstone_torch:lit=true minecraft:redstone_wall_torch:lit=true minecraft:redstone_lamp:lit=true

# El cristal del End es una entidad, no un bloque; su ID está en entity.properties.
